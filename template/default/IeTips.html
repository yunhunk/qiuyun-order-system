<script type="text/javascript">
    var ie_version = (function() {
        var userAgent = navigator.userAgent,
            isLessIE11 = userAgent.indexOf('compatible') > -1 && userAgent.indexOf('MSIE') > -1,
            isEdge = userAgent.indexOf('Edge') > -1 && !isLessIE11,
            isIE11 = userAgent.indexOf('Trident') > -1 && userAgent.indexOf('rv:11.0') > -1;
        if (isLessIE11) {
            var IEReg = new RegExp('MSIE (\\d+\\.\\d+);');
            IEReg.test(userAgent);
            var IEVersionNum = parseFloat(RegExp['$1']);
            if (IEVersionNum === 7) { // IE7
                return 7
            } else if (IEVersionNum === 8) { // IE8
                return 8
            } else if (IEVersionNum === 9) { // IE9
                return 9
            } else if (IEVersionNum === 10) { // IE10
                return 10
            } else {
                return 6
            }
        } else if (isEdge) { // edge
            return 'edge'
        } else if (isIE11) { // IE11
            return 11
        } else { // 不是ie浏览器
            return -1
        }
    }());
    if (ie_version != -1 && ie_version < 10 && ie_version != 'edge') {
        var title = document.createElement('div');
        title.setAttribute('class', 'content')
        title.setAttribute('style', 'height: 50px;position: absolute;top: 0;left: 0;right: 0;line-height: 50px;z-index: 9999999;background: rgba(0,0,0,.5);text-align: center;color: #ff922e;font-size: 17px;font-weight: 600;')
        title.innerHTML = '<span style="top: 0px; width: 100%; text-align: center; position: absolute;"><span style="text-align: center;">当前浏览器IE版本较低，推荐使用QQ浏览器/谷歌浏览器或使用极速模式访问</span></span><span class="compatibility_tips" style="position: absolute;right: 15px;top: 10px;font-size: 14px;display: inline-block; height: 30px;line-height: 28px;padding: 0 12px;font-weight: 500;color: #ffffff; border-radius: 4px;cursor: pointer;border: 2px solid #ffffff;font-weight: 500;">关闭提示</span>'
        title.querySelector('.compatibility_tips').addEventListener('click', function(res) {
            var parentNode = this.parentElement;
            parentNode.parentElement.removeChild(parentNode)
        })
        document.querySelector('html').appendChild(title)
    } else if (ie_version != -1 && (ie_version >= 10 || ie_version === 'edge')) {
        var title = document.createElement('div');
        title.setAttribute('class', 'content')
        title.setAttribute('style', 'height: 50px;position: absolute;top: 0;left: 0;right: 0;line-height: 50px;z-index: 9999999;background: rgba(0,0,0,.5);text-align: center;color: #ff922e;font-size: 17px;font-weight: 600;')
        title.innerHTML = '<span style="top: 0px; width: 100%; text-align: center; position: absolute;"><span style="text-align: center;">当前浏览器可能存在视图异常或无法使用情况，推荐使用QQ浏览器等或使用极速模式访问</span></span><span class="compatibility_tips" style="position: absolute;right: 15px;top: 10px;font-size: 14px;display: inline-block; height: 30px;line-height: 28px;padding: 0 12px;font-weight: 500;color: #ffffff; border-radius: 4px;cursor: pointer;border: 2px solid #ffffff;font-weight: 500;">关闭提示</span>'
        title.querySelector('.compatibility_tips').addEventListener('click', function(res) {
            var parentNode = this.parentElement;
            parentNode.parentElement.removeChild(parentNode)
        })
        document.querySelector('html').appendChild(title)
    }
</script>
